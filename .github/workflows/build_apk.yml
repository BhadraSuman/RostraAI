name: Build & Release APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release with direct APK download'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Extract and display debug keystore SHA-1 and SHA-256 fingerprints
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || true

      - name: Verify code analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK for release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk RostraAI-${{ github.ref_name }}.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RostraAI-Release-APK
          path: app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: RostraAI ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            app-release.apk
            RostraAI-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          body: |
            ## 🚀 RostraAI Release
            - Live CR Sync and WhatsApp prefilled broadcasts
            - 13 Stitch screens implemented (Warm Campus Utility theme)
            - DPDP Act compliant age confirmation (18+)
            - Offline timetable cache & integer margin attendance calculator
            
            ### 📲 How to Install:
            1. Download `app-release.apk` below directly onto your Android device.
            2. Tap to install (enable "Install unknown apps" if prompted).
            3. Future updates will be notified and updated automatically inside the app!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
